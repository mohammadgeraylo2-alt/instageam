<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Instagram</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <!-- ---------- صفحه ورود ---------- -->
  <div id="login-screen" class="login-screen">
    <div class="login-box">
      <div class="logo login-logo">Instagram</div>
      <input id="login-username" type="text" placeholder="یوزرنیم" autocomplete="username">
      <input id="login-password" type="password" placeholder="رمز عبور" autocomplete="current-password">
      <input id="login-2fa" type="text" placeholder="کد تایید دومرحله‌ای" style="display:none">
      <button id="login-btn">ورود</button>
      <p id="login-error" class="error"></p>
      <p class="signup-line">حساب نداری؟ <a id="signup-link" href="https://www.instagram.com/accounts/emailsignup/" target="_blank" rel="noopener">ثبت‌نام کن</a></p>
    </div>
  </div>

  <!-- ---------- اپ اصلی ---------- -->
  <div id="app-screen" class="app-screen" style="display:none">
    <header class="topbar">
      <span class="logo">Instagram</span>
      <div class="topbar-icons">
        <svg viewBox="0 0 24 24" class="icon"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </div>
    </header>

    <div id="search-bar" class="search-bar" style="display:none">
      <svg viewBox="0 0 24 24" class="icon small"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2"/></svg>
      <input id="search-input" type="text" placeholder="جستجوی یوزرنیم...">
    </div>

    <main>
      <p id="error-box" class="error"></p>
      <section id="profile-section"></section>
      <div id="explore-grid" class="explore-grid" style="display:none"></div>
      <div id="feed"></div>
    </main>

    <div id="reels-container" class="reels-container" style="display:none"></div>

    <nav class="bottombar">
      <svg viewBox="0 0 24 24" class="nav-icon active" id="nav-home"><path d="M3 11l9-8 9 8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 10v10h14V10" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <svg viewBox="0 0 24 24" class="nav-icon" id="nav-explore"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2"/></svg>
      <svg viewBox="0 0 24 24" class="nav-icon" id="nav-reels"><rect x="2" y="3" width="20" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="10,8 16,12 10,16" fill="currentColor"/></svg>
      <svg viewBox="0 0 24 24" class="nav-icon" id="nav-profile"><path d="M3 9l9-7 9 7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 10v10h5v-6h6v6h5V10" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <img id="nav-profile-pic" class="nav-icon nav-avatar" src="" alt="" style="display:none">
    </nav>
  </div>

  <div id="modal" class="modal">
    <div class="modal-box">
      <button id="modal-close">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
  </html>
